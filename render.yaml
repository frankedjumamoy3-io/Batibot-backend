services:
  - type: web
    name: batibot-backend
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "14"
      - key: JWT_ISSUER
        value: batibot-backend
      - key: JWT_AUDIENCE
        value: batibot-mobile
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD_HASH
        sync: false
      - key: ADMIN_BOOTSTRAP_DISPLAY_NAME
        value: BatiBot Admin
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6.1-sol
      - key: AI_TIMEOUT_MS
        value: "60000"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
